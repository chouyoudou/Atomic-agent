<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Page</title>
    <script src="https://3dmol.csb.pitt.edu/build/3Dmol-min.js"></script>
</head>
<body>
    <h1>Debug Page</h1>
    <div id="debug-info"></div>
    <div id="3dmol-viewer" style="width: 400px; height: 300px; border: 1px solid black;"></div>

    <script>
        console.log('Debug script starting...');

        // Check if 3Dmol is loaded
        if (typeof window.$3Dmol !== 'undefined') {
            console.log('✅ 3Dmol.js loaded successfully');
            document.getElementById('debug-info').innerHTML += '<p>✅ 3Dmol.js loaded</p>';

            // Try to create a simple viewer
            try {
                const viewer = window.$3Dmol.createViewer(document.getElementById('3dmol-viewer'));
                console.log('✅ 3Dmol viewer created successfully');
                document.getElementById('debug-info').innerHTML += '<p>✅ 3Dmol viewer created</p>';

                // Add a simple atom
                viewer.addAtom({elem: 'H', x: 0, y: 0, z: 0});
                viewer.setStyle({}, {sphere: {scale: 0.3}});
                viewer.zoomTo();
                viewer.render();

                console.log('✅ Simple atom rendered');
                document.getElementById('debug-info').innerHTML += '<p>✅ Simple atom rendered</p>';

            } catch (error) {
                console.error('❌ Error creating 3Dmol viewer:', error);
                document.getElementById('debug-info').innerHTML += '<p>❌ Error creating 3Dmol viewer: ' + error.message + '</p>';
            }
        } else {
            console.error('❌ 3Dmol.js not loaded');
            document.getElementById('debug-info').innerHTML += '<p>❌ 3Dmol.js not loaded</p>';
        }

        // Test fetch API
        fetch('/api/sessions')
            .then(response => response.json())
            .then(data => {
                console.log('✅ API test successful:', data);
                document.getElementById('debug-info').innerHTML += '<p>✅ API works, sessions: ' + data.sessions.length + '</p>';
            })
            .catch(error => {
                console.error('❌ API test failed:', error);
                document.getElementById('debug-info').innerHTML += '<p>❌ API test failed: ' + error.message + '</p>';
            });
    </script>
</body>
</html>
