version: '3.8'

services:
  # Redis服务
  redis:
    image: redis:7-alpine
    container_name: ase_mcp_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - ase_mcp_network

  # 后端API服务
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    container_name: ase_mcp_backend
    ports:
      - "8000:8000"
      - "8001:8001"
    environment:
      - REDIS_URL=redis://redis:6379
      - WEB_HOST=0.0.0.0
      - LOG_LEVEL=INFO
    volumes:
      - ../data:/app/data
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - ase_mcp_network

  # 前端服务
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.client
    container_name: ase_mcp_frontend
    ports:
      - "3000:80"
    environment:
      - REACT_APP_API_BASE_URL=http://localhost:8000
      - REACT_APP_WEBSOCKET_URL=ws://localhost:8001
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - ase_mcp_network

volumes:
  redis_data:

networks:
  ase_mcp_network:
    driver: bridge
